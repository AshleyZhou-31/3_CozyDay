{% extends "base.html" %}

{% block title %}
Plan Items - CozyDay
{% endblock %}

{% block content %}

<h2>Plan Items</h2>

<div class="plan-list">
    {% for item in items %}
        <a class="plan-card" href="{{ item.get_absolute_url }}">
            <span>{{ item.title }}</span>
            <span class="plan-arrow">›</span>
        </a>
    {% empty %}
        <p>No plan items available yet.</p>
    {% endfor %}
</div>

{% endblock %}
