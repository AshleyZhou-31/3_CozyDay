{% extends "base.html" %}

{% block title %}
Plan Items - CozyDay
{% endblock %}

{% block content %}

<h2>Plan Items</h2>

<ul>
    {% for item in items %}
        <li><a href="{{ item.get_absolute_url }}">{{ item.title }}</a></li>
    {% empty %}
        <li>No plan items available yet.</li>
    {% endfor %}
</ul>

{% endblock %}
